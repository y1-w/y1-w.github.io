name: One-time MTIA 300 Atlas rebuild
on:
  push:
    branches: [atlas-mtia300-architecture-20261106]
    paths: [.github/workflows/atlas-mtia300-build-once.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-mtia300-architecture-20261106
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Atlas outputs
        run: python tools/accelerator-atlas/build.py
      - name: Test MTIA page and diagrams
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('tools/accelerator-atlas')
          d=json.loads((root/'details/mtia300.json').read_text())
          page=(root/'chips/mtia300/index.html').read_text()
          assert len(d['figures'])==6
          assert len(d['sections'])>=8
          for i in range(1,7):
              assert f'id="fig-mtia300-{i}"' in page
          assert 'id="fig-mtia300-mem"' in page
          for label in ('HCCL device-executable collective graph','Dense GEMM versus sparse embedding dataflow','Message Engine and RDMA collective offload'):
              assert label in page
          assert 'class="archfig"' in page
          print('MTIA 300 generated figures and sections: OK')
          PY
      - name: Keep other chip detail pages unchanged
        run: |
          for dir in tools/accelerator-atlas/chips/*; do
            [ -d "$dir" ] || continue
            [ "$(basename "$dir")" = "mtia300" ] || git restore -- "$dir"
          done
      - name: Commit generated files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/atlas-mtia300-build-once.yml
          git add tools/accelerator-atlas
          if ! git diff --cached --quiet; then
            git commit -m "Build MTIA 300 Atlas architecture page with existing style"
            git push origin HEAD:atlas-mtia300-architecture-20261106
          fi
